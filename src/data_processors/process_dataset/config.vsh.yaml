name: "process_dataset"
namespace: "data_processors"
argument_groups:
  - name: Inputs
    arguments:
      - name: "--input_mod1"
        __merge__: "/src/api/file_common_dataset_mod1.yaml"
        required: true
        direction: input
      - name: "--input_mod2"
        __merge__: "/src/api/file_common_dataset_mod2.yaml"
        direction: input
        required: true
  - name: Outputs
    arguments:
      - name: "--output_train_mod1"
        __merge__: /src/api/file_train_mod1.yaml
        direction: output
        required: true
      - name: "--output_train_mod2"
        __merge__: /src/api/file_train_mod2.yaml
        direction: output
        required: true
      - name: "--output_test_mod1"
        __merge__: /src/api/file_test_mod1.yaml
        direction: "output"
        required: true
      - name: "--output_test_mod2"
        __merge__: /src/api/file_test_mod2.yaml
        direction: output
        required: true
  - name: Parameters
    arguments:
      - name: "--dataset_id"
        type: "string"
        description: "New dataset ID"
        required: false
      - name: "--swap"
        type: "boolean"
        description: "Swap mod1 and mod2"
        default: false
      - name: "--seed"
        type: "integer"
        description: "The seed for determining the train/test split."
        default: 1
      - name: "--max_test_cells"
        type: "integer"
        description: "Maximum test cells; -1 keeps every test cell."
        default: 1000
      - name: "--preserve_obs_columns"
        type: "string"
        description: "Comma-separated input obs columns to retain (batch,size_factors by default)."
        default: "batch,size_factors"
      - name: "--preserve_var_columns"
        type: "string"
        description: "Comma-separated input var columns to retain (gene_ids and optional HVG fields by default)."
        default: "gene_ids,hvg,hvg_score"
resources:
  - type: r_script
    path: script.R
engines:
  - type: docker
    image: openproblems/base_r:1
    setup:
      - type: docker
        run: |
          python3 -m venv --without-pip /opt/tchic-python
          python3 -m pip --python /opt/tchic-python/bin/python install --no-cache-dir pip==24.0 anndata==0.11.4 numpy==2.2.6 scipy==1.15.3 pandas==2.3.3 h5py==3.16.0
          /opt/tchic-python/bin/python -c 'import anndata, numpy'
info:
  tchic_runtime:
    base_sif_sha256: d9406ebde369d5b6e4dff7441ec9ba4866d2c99a8a5d9d35b0699cb6f4fb04da
    reticulate_python: /opt/tchic-python/bin/python
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [hightime, highmem, highcpu]
test_resources:
  - type: python_script
    path: /common/component_tests/run_and_check_output.py
  - path: /resources_test/common/openproblems_neurips2021/bmmc_cite
    dest: resources_test/common/openproblems_neurips2021/bmmc_cite
