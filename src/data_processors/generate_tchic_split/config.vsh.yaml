name: generate_tchic_split
namespace: data_processors
summary: Generate a reproducible T-ChIC plate-level data split.
description: >
  Generate a reproducible T-ChIC plate-level train/validation/test split from
  cell metadata only. The manifest label test denotes the final holdout.
arguments:
  - name: --input_metadata
    type: file
    description: Filtered H5AD whose obs table contains plate metadata.
    required: true
    direction: input
  - name: --input_settings
    type: file
    description: Explicit JSON settings for the split search.
    required: true
    direction: input
  - name: --output_manifest
    type: file
    description: Per-plate CSV assignment.
    required: true
    direction: output
  - name: --output_provenance
    type: file
    description: JSON settings, metadata fingerprint, versions, and scores.
    required: true
    direction: output
resources:
  - type: python_script
    path: script.py
engines:
  - type: docker
    image: openproblems/base_python:1
  - type: native
runners:
  - type: executable
test_resources:
  - type: python_script
    path: tests/check_viash_config.py
